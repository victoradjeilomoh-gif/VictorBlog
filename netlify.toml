[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: everything that isn't a function or a real file serves index.html.
# (Function routes like /api/* are matched first by Netlify.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
